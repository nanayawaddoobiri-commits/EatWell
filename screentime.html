<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Time</title>

<link rel="stylesheet" href="something.css">

</head>

<body>

<section class="section">

<div class="screen-box">

<h3>📱 Screen Time Tracker</h3>

<p>Track how much time you spend on your device today.</p>

<div class="input-group">
<span class="icon">⏱</span>
<input id="screenMinutes" type="number" placeholder="Enter minutes used today">
</div>

<button onclick="addScreenTime()" class="btn-main">Add Screen Time</button>

<p class="mt-3">Today's Screen Time: <span id="screenTotal">0</span> minutes</p>

<div class="progress-bar-container">
<div id="screenProgress" class="progress-bar"></div>
</div>

</div>

</section>
<script src="something.js"></script>

</body>
</html>
